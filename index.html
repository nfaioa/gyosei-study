  <header class="hero"><div class="hero-inner"><div class="brand"><div class="brand-logo">法</div><span>行政書士の学び舎</span></div><div class="eyebrow" style="margin-top:24px">YOUR PERSONAL STUDY SPACE</div><h1>理解した問題は少し先へ。<br>曖昧な問題は、もう一度。</h1><p>正誤だけでなく「理解できたか」を記録する、個人用の行政書士学習アプリです。</p><div class="hero-sub"><span class="tag">試作版 v0.2</span><span class="tag">基本機能無料</span><span class="tag">記録はこの端末に保存</span></div></div></header>
  <main class="wrap"><nav class="tabs" aria-label="メニュー"><button class="tab active" data-tab="study">問題を解く</button><button class="tab" data-tab="analysis">学習分析</button><button class="tab" data-tab="manage">問題を管理</button><button class="tab" data-tab="data">保存・設定</button></nav><div id="app" aria-live="polite"></div><div class="footer">学習用の試作品です。収録の初期問題はオリジナル例題であり、本試験過去問ではありません。</div></main>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script>
  'use strict';
  const SEED = [
    {id:'s01',topic:'行政法',theme:'行政手続法／審査基準',prompt:'行政手続法上の審査基準について、正しいものはどれか。',options:['行政庁は、審査基準を定める必要がない。','行政庁は、審査基準を定めるものとされている。','審査基準は、必ず法律の条文そのものと同一でなければならない。','審査基準は、許認可の性質と無関係に定めなければならない。'],answer:1,explanation:'行政手続法5条1項は「行政庁は、審査基準を定めるものとする」と規定しています。同条2項は、許認可等の性質に照らしてできる限り具体的にすることを求めています。',sourceLabel:'行政手続法 第5条',sourceUrl:'https://laws.e-gov.go.jp/law/405AC0000000088'},
    {id:'s02',topic:'行政法',theme:'行政手続法／審査基準の公表',prompt:'行政手続法5条における審査基準の公表について、正しいものはどれか。',options:['審査基準の公表は、いかなる場合にも禁止される。','審査基準は、必ず官報に全文を掲載しなければならない。','行政上特別の支障があるときを除き、審査基準を公にしておかなければならない。','審査基準は、申請が不許可になったときに初めて示せばよい。'],answer:2,explanation:'行政手続法5条3項は、行政上特別の支障があるときを除き、備付けその他の適当な方法で審査基準を公にしておくことを求めています。',sourceLabel:'行政手続法 第5条第3項',sourceUrl:'https://laws.e-gov.go.jp/law/405AC0000000088'},
    {id:'s03',topic:'行政法',theme:'行政手続法／標準処理期間',prompt:'行政手続法6条の標準処理期間について、正しいものはどれか。',options:['行政庁は、標準処理期間を定めるよう努めるものとされる。','行政庁は、必ず一律30日を標準処理期間としなければならない。','標準処理期間を定めた場合も公表する必要はない。','標準処理期間を超えた申請は自動的に許可になる。'],answer:0,explanation:'行政手続法6条は、標準処理期間を定めることを努力義務としています。一方、定めたときは公にしておかなければなりません。',sourceLabel:'行政手続法 第6条',sourceUrl:'https://laws.e-gov.go.jp/law/405AC0000000088'},
    {id:'s04',topic:'行政法',theme:'行政手続法／申請の審査',prompt:'適用除外のない行政手続法上の申請が行政庁の事務所に到達した場合、行政庁の対応として原則正しいものはどれか。',options:['申請者が催促するまで審査を開始しなくてよい。','到達後30日が経過するまでは審査を開始できない。','遅滞なく申請の審査を開始しなければならない。','形式的な不備がある申請は一切扱ってはならない。'],answer:2,explanation:'行政手続法7条は、申請が事務所に到達したときは遅滞なく審査を開始することを定めています。形式上の要件に適合しない場合は、補正を求めるか許認可等を拒否する対応が規定されています。',sourceLabel:'行政手続法 第7条',sourceUrl:'https://laws.e-gov.go.jp/law/405AC0000000088'},
    {id:'s05',topic:'行政法',theme:'行政手続法／拒否処分の理由',prompt:'申請により求められた許認可等を拒否する処分について、行政手続法8条の原則として正しいものはどれか。',options:['拒否処分に理由を示す必要はない。','行政庁は拒否処分と同時に理由を示さなければならない。','理由は必ず拒否処分から1年後に示す。','拒否処分の理由提示は、行政手続法上禁止されている。'],answer:1,explanation:'行政手続法8条1項は、許認可等の拒否処分をするときは、原則として同時に理由を示すことを求めます。客観的指標が明確で不適合が申請内容から明らかな場合などには例外があります。',sourceLabel:'行政手続法 第8条',sourceUrl:'https://laws.e-gov.go.jp/law/405AC0000000088'},
    {id:'s06',topic:'行政法',theme:'行政手続法／不利益処分',prompt:'行政手続法14条に基づく不利益処分の理由提示について、原則正しいものはどれか。',options:['処分の理由は必ず10年後に提示すれば足りる。','行政庁は、不利益処分をする場合、原則として同時にその理由を示す。','不利益処分には理由を示す制度が存在しない。','理由を示すことは、処分の名あて人が法人なら常に不要である。'],answer:1,explanation:'行政手続法14条1項は、不利益処分をする場合は、名あて人に同時に理由を示すのが原則とします。ただし、差し迫った必要がある場合の例外があります。',sourceLabel:'行政手続法 第14条第1項',sourceUrl:'https://laws.e-gov.go.jp/law/405AC0000000088'},
    {id:'s07',topic:'行政法',theme:'行政手続法／書面による理由提示',prompt:'行政手続法14条において、不利益処分を書面でする場合の理由提示について、正しいものはどれか。',options:['理由は常に口頭のみで示す。','理由提示自体が禁じられている。','法定の理由提示は書面によらなければならない。','必ず新聞公告によってのみ理由を示す。'],answer:2,explanation:'行政手続法14条3項は、不利益処分を書面でするとき、同条に基づく理由は書面により示さなければならないと規定しています。',sourceLabel:'行政手続法 第14条第3項',sourceUrl:'https://laws.e-gov.go.jp/law/405AC0000000088'},
    {id:'s08',topic:'行政法',theme:'行政不服審査法／主観的期間',prompt:'再調査の請求をしていない通常の場合、処分についての審査請求の期間（処分があったことを知った時を基準）として、原則正しいものはどれか。',options:['知った日の翌日から起算して3か月','知った日から起算して3年','知った日の翌日から起算して6か月','知った日の翌日から起算して30日'],answer:0,explanation:'行政不服審査法18条1項。通常、処分があったことを知った日の翌日から3か月を経過すると審査請求できません。ただし、正当な理由がある場合の例外があります。',sourceLabel:'行政不服審査法 第18条第1項',sourceUrl:'https://laws.e-gov.go.jp/law/426AC0000000068'},
    {id:'s09',topic:'行政法',theme:'行政不服審査法／客観的期間',prompt:'再調査の請求をしていない通常の場合、処分についての審査請求の期間（処分の日を基準）として、原則正しいものはどれか。',options:['処分の日の翌日から起算して1年','処分の日から起算して10年','処分の日の翌日から起算して2週間','処分の日から起算して無期限'],answer:0,explanation:'行政不服審査法18条2項。原則として、処分があった日の翌日から1年を経過すると審査請求できません。ただし、正当な理由がある場合など例外があります。',sourceLabel:'行政不服審査法 第18条第2項',sourceUrl:'https://laws.e-gov.go.jp/law/426AC0000000068'},
    {id:'s10',topic:'行政法',theme:'行政事件訴訟法／主観的出訴期間',prompt:'取消訴訟の出訴期間について、処分又は裁決があったことを知った日を基準とする原則的な期間はどれか。',options:['1か月','3か月','6か月','3年'],answer:2,explanation:'行政事件訴訟法14条1項。処分又は裁決があったことを知った日から6か月を経過すると、原則として取消訴訟を提起できません。正当な理由がある場合などの例外に注意してください。',sourceLabel:'行政事件訴訟法 第14条第1項',sourceUrl:'https://laws.e-gov.go.jp/law/337AC0000000139'},
    {id:'s11',topic:'行政法',theme:'行政事件訴訟法／客観的出訴期間',prompt:'取消訴訟の出訴期間について、処分又は裁決の日を基準とする原則的な期間はどれか。',options:['14日','1か月','6か月','1年'],answer:3,explanation:'行政事件訴訟法14条2項。処分又は裁決の日から1年を経過すると、原則として取消訴訟を提起できません。正当な理由がある場合などは例外です。',sourceLabel:'行政事件訴訟法 第14条第2項',sourceUrl:'https://laws.e-gov.go.jp/law/337AC0000000139'},
    {id:'s12',topic:'行政法',theme:'行政事件訴訟法／比較',prompt:'原則的な期間の比較として、正しいものはどれか。',options:['審査請求は知った日の翌日から3か月、取消訴訟は知った日から6か月','審査請求も取消訴訟も、知った日の翌日から1週間','審査請求は知った日の翌日から6か月、取消訴訟は知った日から3か月','審査請求も取消訴訟も、知った日から10年'],answer:0,explanation:'行政不服審査法18条1項の「翌日から3か月」と、行政事件訴訟法14条1項の「知った日から6か月」を対比しましょう。いずれも例外があり、審査請求を経た場合は取消訴訟の期間について特則があります。',sourceLabel:'行政不服審査法 第18条／行政事件訴訟法 第14条',sourceUrl:'https://laws.e-gov.go.jp/law/337AC0000000139'}
  ];
  const KEY='gyosei-self-study-v1';
  const blank=()=>({version:1,records:{},customQuestions:[],history:[],aiChats:{}});
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x && x.version===1 && x.records && Array.isArray(x.customQuestions)?x:blank()}catch(e){return blank()}}
  let data=load();

  function manageHTML(){const custom=data.customQuestions;const editing=custom.find(q=>q.id===ui.editId);

  function dataHTML(){return `<div class="section-header"><h2>保存・設定</h2><p>学習記録はこの端末のブラウザに保存されます。定期的にバックアップを作成してください。</p></div><div class="stack"><section class="panel"><h2>AI家庭教師の接続設定（無料枠で利用可能）</h2><p class="small muted">Cloudflare Workerを一度作成し、URLと自分用の合言葉を登録してください。通常の問題演習には接続不要です。</p><form id="aiSettingsForm"><div class="field"><label for="aiEndpoint">WorkerのURL</label><input id="aiEndpoint" type="url" class="control" placeholder="https://gyosei-tutor.あなたのサブドメイン.workers.dev" value="${escapeHTML(aiSettings.endpoint||'')}"></div><div class="field"><label for="aiSecret">合言葉（16文字以上・変更しない場合は空欄）</label><input id="aiSecret" type="password" class="control" autocomplete="off" minlength="16" placeholder="${aiSettings.secret?'保存済み（入力不要）':'Cloudflareで登録した合言葉'}"></div><div class="actions"><button class="btn btn-primary" type="submit">AI接続設定を保存</button><button class="btn" type="button" data-action="clearAI">AI接続設定を消去</button></div></form><p class="tiny muted">合言葉はこの端末だけに保存され、バックアップJSONには含まれません。AIに質問した内容はCloudflareのAIに送信されます。</p></section><section class="panel"><h2>バックアップを保存</h2><p class="muted small">解答履歴・メモ・追加した問題・AIとの会話を1つのJSONファイルに書き出します（AI接続用の合言葉は除外）。タブレット変更時の復元にも使えます。</p><button class="btn btn-primary" data-action="export">JSONバックアップをダウンロード</button></section><section class="panel"><h2>JSONファイルを読み込む</h2><p class="muted small">このアプリから書き出したバックアップ、または所定形式の問題データ（JSON）を読み込めます。問題だけの取り込みでは、既存の学習履歴は保持します。</p><button class="btn" data-action="import">JSONを選択して読み込む</button><p class="tiny muted" style="margin-top:12px">問題データの形式：<code>{"questions":[{"topic":"行政法","theme":"論点","prompt":"設問","options":["A","B","C","D"],"answer":0,"explanation":"解説","sourceLabel":"出典","sourceUrl":"https://..."}]}</code></p></section><section class="panel"><h2>保存の仕組み</h2><div class="warning">ブラウザの閲覧データを消去すると学習記録も消える可能性があります。MacとAndroidは自動同期されません。バックアップファイルの保存をおすすめします。</div><p class="small muted" style="margin-top:13px">通常の問題演習と学習分析は端末内で動きます。AI家庭教師を接続して質問すると、その問題文や会話がCloudflareへ送信されます。</p></section><section   function validQuestion(q){return q&&typeof q.topic==='string'&&q.topic.trim()&&typeof q.theme==='string'&&q.theme.trim()&&typeof q.prompt==='string'&&q.prompt.trim()&&Array.isArray(q.options)&&q.options.length===4&&q.options.every(o=>typeof o==='string'&&o.trim())&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4&&typeof q.explanation==='string'&&q.explanation.trim()}
  function normalizeQuestion(q){return {id:'u-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),topic:q.topic.trim().slice(0,40),theme:q.theme.trim().slice(0,100),prompt:q.prompt.trim().slice(0,3000),options:q.options.map(o=>o.trim().slice(0,1000)),answer:q.answer,explanation:q.explanation.trim().slice(0,5000),sourceLabel:String(q.sourceLabel||'').slice(0,120),sourceUrl:typeof q.sourceUrl==='string'&&/^https:\/\//.test(q.sourceUrl)?q.sourceUrl:''}}
  function questionFromForm(){return {topic:$('topicInput').value,theme:$('themeInput').value,prompt:$('promptInput').value,options:[0,1,2,3].map(i=>$('opt'+i).value),answer:Number($('answerInput').value),explanation:$('explanationInput').value,sourceLabel:$('sourceLabelInput').value,sourceUrl:$('sourceUrlInput').value}}
  function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
  async function copyAI(){const q=currentQuestion();if(!q)return;persistNote();const x=`行政書士試験の勉強で、この問題について質問したいです。条文の根拠・例外・具体例も説明してください。法改正があれば注意してください。\n\n【問題】${q.prompt}\n${q.options.map((o,i)=>`${i+1}. ${o}`).join('\n')}\n\n【選んだ答え】${ui.choice+1}\n【正解】${q.answer+1}\n【既存の解説】${q.explanation}\n【自分のメモ】${record(q)?.note||'なし'}\n\nどこがわからないか、ここから質問します：`;
    try{await navigator.clipboard.writeText(x);toast('問題・正解・解説をコピーしました')}catch(e){const area=document.createElement('textarea');area.value=x;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();if(ok)toast('コピーしました');else prompt('この内容をコピーしてChatGPTに貼り付けてください',x)}}
  async function sendAI(e){
    e.preventDefault();if(ui.aiSending)return;
    const q=currentQuestion(), input=$('aiMessage'), message=input?.value.trim();
    if(!q||!ui.revealed||!message||!aiSettings.endpoint||!aiSettings.secret)return;
    if(!/^https:\/\/[a-z0-9.-]+(?:\/[a-zA-Z0-9/_-]*)?$/i.test(aiSettings.endpoint)){toast('AI接続URLが不正です');return}
    const before=Array.isArray(data.aiChats[q.id])?data.aiChats[q.id]:[];
    const backlog=before.slice(-10).map(m=>({role:m.role,content:m.content}));
    ui.aiSending=true;input.disabled=true;const button=input.closest('form')?.querySelector('button[type=submit]');if(button){button.disabled=true;button.textContent='AIが回答中…'}
    try{
      const url=aiSettings.endpoint.replace(/\/$/,'')+'/chat';
      const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),45000);
      let response;
      try{response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+aiSettings.secret},body:JSON.stringify({question:{prompt:q.prompt,options:q.options,answer:q.answer,explanation:q.explanation,sourceLabel:q.sourceLabel,sourceUrl:q.sourceUrl},messages:[...backlog,{role:'user',content:message}]}),signal:controller.signal})}
      finally{clearTimeout(timer)}
      const result=await response.json().catch(()=>({error:'AIサーバーの応答を読み取れませんでした'}));
      if(!response.ok)throw new Error(result.error||('接続エラー '+response.status));
      if(typeof result.reply!=='string'||!result.reply.trim())throw new Error('AIから回答がありませんでした');
      const chat=(data.aiChats[q.id]||[]).concat({role:'user',content:message,at:new Date().toISOString()},{role:'assistant',content:result.reply.trim().slice(0,5000),at:new Date().toISOString()});
      data.aiChats[q.id]=chat.slice(-40);save();toast('回答を保存しました');
    }catch(err){alert('AIへの質問に失敗しました：'+(err.name==='AbortError'?'応答がタイムアウトしました':err.message))}
    finally{ui.aiSending=false;render()}
  }
  document.addEventListener('click',ev=>{const el=ev.target.closest('button[data-action],button[data-tab]');if(!el)return;
    if(el.dataset.tab){ui.tab=el.dataset.tab;ui.editId=null;ui.current=null;ui.search='';render();window.scrollTo({top:0,behavior:'smooth'});return}
    const action=el.dataset.action,v=el.dataset.value;
    if(action==='select'){if(!ui.revealed){ui.choice=Number(v);render()}return}
    if(action==='check'){if(ui.choice!==null){ui.revealed=true;render()}return}
    if(action==='skip'){nextQuestion(ui.current);render();return}
    if(action==='rate'){rate(v);return}
    if(action==='saveNote'){persistNote();toast('メモを保存しました');return}
    if(action==='showWeak'){ui.tab='study';ui.mode='weak';ui.topic='すべて';ui.current=null;render();return}
    if(action==='clearAI'){if(confirm('この端末のAI接続URLと合言葉を消去しますか？')){aiSettings={endpoint:'',secret:''};localStorage.removeItem(AI_KEY);render();toast('AI接続設定を消去しました')}return}
    if(action==='copyAI'){copyAI();return}
    if(action==='mode'){ui.mode=v;ui.current=null;ui.choice=null;ui.revealed=false;render();return}
    if(action==='cancelEdit'){ui.editId=null;render();return}
    if(action==='edit'){ui.editId=v;render();window.scrollTo({top:220,behavior:'smooth'});return}
    if(action==='delete'){const q=data.customQuestions.find(x=>x.id===v);if(q&&confirm(`「${q.theme}」を削除しますか？（この問題の履歴も削除します）`)){data.customQuestions=data.customQuestions.filter(x=>x.id!==v);delete data.records[v];data.history=data.history.filter(x=>x.id!==v);delete data.aiChats[v];if(ui.editId===v)ui.editId=null;save();render();toast('問題を削除しました')}return}
    if(action==='export'){download('gyosei-study-backup-'+new Date().toISOString().slice(0,10)+'.json',{app:'gyosei-self-study',version:1,exportedAt:new Date().toISOString(),data});toast('バックアップを書き出しました');return}
    if(action==='import'){$('importFile').click();return}
    if(action==='reset'){if(confirm('記録・メモ・追加問題をすべて初期化します。バックアップはありますか？')){if(confirm('本当に初期化しますか？この操作は取り消せません。')){data=blank();save();ui.current=null;ui.editId=null;render();toast('学習データを初期化しました')}}return}
  });
  $('app').addEventListener('submit',e=>{
    if(e.target.id==='aiChatForm'){sendAI(e);return}
    if(e.target.id==='aiSettingsForm'){e.preventDefault();const ep=$('aiEndpoint').value.trim().replace(/\/$/,'');const secret=$('aiSecret').value.trim()||aiSettings.secret;if(!/^https:\/\/[a-z0-9.-]+(?:\/[a-zA-Z0-9/_-]*)?$/i.test(ep)){alert('https://で始まるWorker URLを入力してください');return}if(!secret||secret.length<16){alert('Cloudflareで設定した16文字以上の合言葉を入力してください');return}aiSettings={endpoint:ep,secret};localStorage.setItem(AI_KEY,JSON.stringify(aiSettings));render();toast('AI接続設定を保存しました');return}
    if(e.target.id!=='questionForm')return;e.preventDefault();const incoming=questionFromForm();if(!validQuestion(incoming)){alert('問題文・4選択肢・解説をすべて入力してください');return}const q=normalizeQuestion(incoming);if(ui.editId){q.id=ui.editId;data.customQuestions=data.customQuestions.map(x=>x.id===ui.editId?q:x);ui.editId=null;toast('問題を更新しました')}else{data.customQuestions.push(q);toast('問題を追加しました')}save();render()});
  $('app').addEventListener('change',e=>{if(e.target.id==='topicSelect'){ui.topic=e.target.value;ui.current=null;render()}});
  $('app').addEventListener('input',e=>{if(e.target.id==='searchInput'){ui.search=e.target.value;const term=ui.search.toLowerCase();$('questionList')?.querySelectorAll('.list-item').forEach(node=>{node.style.display=(node.dataset.search||'').includes(term)?'':'none'})}});
  $('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(incoming.app==='gyosei-self-study'&&incoming.version===1&&incoming.data){const restored=incoming.data;if(!restored||!Array.isArray(restored.customQuestions)||!restored.records||!Array.isArray(restored.history)||!restored.customQuestions.every(validQuestion))throw Error('バックアップ形式が不正です');if(!confirm('現在の学習データをバックアップの内容で上書きしますか？'))return;data={version:1,records:restored.records,customQuestions:restored.customQuestions,history:restored.history,aiChats:restored.aiChats&&typeof restored.aiChats==='object'&&!Array.isArray(restored.aiChats)?restored.aiChats:{}};save();ui.current=null;render();toast('バックアップを復元しました')}
    else if(Array.isArray(incoming.questions)){const valid=incoming.questions.filter(validQuestion);if(!valid.length)throw Error('4択・正解番号（0〜3）・解説を含む問題が見つかりません');const normalized=valid.map(normalizeQuestion);data.customQuestions.push(...normalized);save();ui.current=null;render();toast(`${normalized.length}問を追加しました${valid.length!==incoming.questions.length?'（不正な項目は除外）':''}`)}else throw Error('対応していないJSON形式です')}
    catch(err){alert('読み込みに失敗しました：'+err.message)}finally{e.target.value=''}});
  render();
  if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
  </script>
</body>
</html>
